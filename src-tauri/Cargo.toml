[package]
name = "writer"
version = "0.1.1"
description = "Surgical AI-assisted writing and editing environment for Markdown and MDX"
edition = "2021"
default-run = "Writer"

# Naming the binary `Writer` ensures macOS Dock & menu bar display it capitalized in dev mode too.
[[bin]]
name = "Writer"
path = "src/main.rs"

# Naming the library `writer_lib` avoids a name collision with the binary target.
[lib]
name = "writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify = "7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
tokio = { version = "1", features = ["fs", "io-util", "process", "rt-multi-thread"] }
trash = "5"

# macOS proc-macro `.dylib` metadata can be stripped by Rust's default release `strip = "debuginfo"`.
[profile.release]
strip = "none"
